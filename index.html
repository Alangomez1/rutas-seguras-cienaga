    // Calculador Dinámico de Rutas en Tiempo Real evitando puntos de peligro
    function generateDynamicRoute(origenBarrio, destinoBarrio) {
      const origCoord = BARRIOS_DATA[origenBarrio] || [10.9910, -74.2480];
      const destCoord = BARRIOS_DATA[destinoBarrio] || [11.0088, -74.2530];

      // Punto seguro de paso intermedio (La Floresta / Carrera 21 o Corredor Este)
      const waypointSeguro = [10.9995, -74.2415];
      const waypointCentroSeguro = [11.0070, -74.2450];

      // Ruta Segura recomendada
      const safePoints = [
        origCoord,
        [origCoord[0] + 0.003, origCoord[1] + 0.003],
        waypointSeguro,
        waypointCentroSeguro,
        destCoord
      ];

      // Ruta Peligrosa directa (la que pasa por Barrio Abajo o zonas anegadas)
      const dangerPoints = [
        origCoord,
        [10.9925, -74.2490], // Hueco Kennedy
        [11.0035, -74.2465], // Inundación Barrio Abajo
        [11.0072, -74.2515], // Alcantarilla Centro
        destCoord
      ];

      return {
        id: `dyn-route-${Date.now()}`,
        origen: origenBarrio,
        destino: destinoBarrio,
        distancia: "3.2 km",
        tiempoEstimado: "9 minutos",
        safePoints: safePoints,
        dangerPoints: dangerPoints,
        peligrosEvitados: [
          "Calle 13 Barrio Abajo (Inundación 45 cm)",
          "Calle 9 Cra 12 Centro (Alcantarilla sin tapa)",
          "Calle 28 Kennedy (Socavón profundo)"

          "Desvío programado hacia Carrera 21 en La Floresta (canal funcionando).",
          "Evadir cruce deprimido de Calle 13 por Calle 16.",
          `Ingreso seguro y despejado al sector de ${destinoBarrio}.`
        ]
      };
    }

            {/* Contenido dinámico */}
            <div className="flex-1 p-3 md:p-6">
              {currentView === 'inicio' && (

                  reports={reports}

              {currentView === 'mapa' && (

                  reports={reports}

              {currentView === 'asistente' && (

              {currentView === 'reportar' && (

    }

    // ==========================================
    // VISTA MAPA EN TIEMPO REAL & TRAZADO DINÁMICO
    // (Con Trazador de Rutas y Simulación de GPS en Vivo)
    // ==========================================
    function MapViewRealTime({ 
      reports, 
      filterSeveridad, 
      setFilterSeveridad, 
      filterBarrio, 
      setFilterBarrio, 
      selectedReportOnMap,
      setSelectedReportOnMap,
      onOpenReportForm,
      currentSkin
    }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersGroupRef = useRef(null);
      const routeLayerGroupRef = useRef(null);
      const liveVehicleMarkerRef = useRef(null);
      const animationTimerRef = useRef(null);

      // Estado de navegación en tiempo real
      const [origen, setOrigen] = useState("Kennedy");
      const [destino, setDestino] = useState("Centro Histórico");
      const [activeRoute, setActiveRoute] = useState(null);
      const [isSimulatingGPS, setIsSimulatingGPS] = useState(false);
      const [simProgress, setSimProgress] = useState(0);
      const [currentSpeed, setCurrentSpeed] = useState(24);
      const [showRadarPrecipitation, setShowRadarPrecipitation] = useState(true);

      const filteredReports = reports.filter(r => {
        const matchSeveridad = filterSeveridad === 'todos' || r.severidad === filterSeveridad;
        const matchBarrio = filterBarrio === 'todos' || r.barrio === filterBarrio;
        return matchSeveridad && matchBarrio;
      });

      // Inicialización del Mapa Leaflet
      useEffect(() => {
        if (!mapContainerRef.current) return;

        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: CIENAGA_CENTER,
            zoom: 14,
            minZoom: 12,
            maxZoom: 18,
            maxBounds: CIENAGA_BOUNDS
          });

          // Capa CartoDB Dark o OpenStreetMap según skin
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap | Rutas Seguras Ciénaga RT',
            maxZoom: 19
          }).addTo(map);

          const markersGroup = L.layerGroup().addTo(map);
          const routeGroup = L.layerGroup().addTo(map);

          mapInstanceRef.current = map;
          markersGroupRef.current = markersGroup;
          routeLayerGroupRef.current = routeGroup;

          // Capa de radar pluvial simulado sobre Ciénaga
          L.circle([11.0069, -74.2486], {
            radius: 2800,
            color: '#10b981',
            fillColor: '#0ea5e9',
            fillOpacity: 0.12,
            weight: 1,
            dashArray: '4, 8'
          }).addTo(map);

          // Trazar ruta inicial por defecto (Kennedy -> Centro)
          calculateAndDrawRoute("Kennedy", "Centro Histórico");
        }

        return () => {
          if (animationTimerRef.current) clearInterval(animationTimerRef.current);
        };
      }, []);

      // Función para calcular y dibujar la ruta dinámica en el mapa
      const calculateAndDrawRoute = (orig, dest) => {
        if (!mapInstanceRef.current || !routeLayerGroupRef.current) return;

        const route = generateDynamicRoute(orig, dest);
        setActiveRoute(route);

        const routeGroup = routeLayerGroupRef.current;
        routeGroup.clearLayers();

        // 1. Trazar Ruta Peligrosa / Bloqueada en Rojo Dotted
        const dangerPolyline = L.polyline(route.dangerPoints, {
          color: '#ef4444',
          weight: 4,
          opacity: 0.7,
          dashArray: '6, 10'
        }).addTo(routeGroup);

        dangerPolyline.bindPopup(`
          <div class="p-3 text-xs">
            <strong class="text-red-600 block mb-1">⚠️ Ruta Directa No Recomendada</strong>
            <p class="text-slate-600">Este trayecto pasa por sectores con inundaciones severas y alcantarillas abiertas en Calle 13 y Calle 28.</p>
          </div>
        `);

        // 2. Trazar Ruta Segura Alternativa en Verde Neón
        const safePolyline = L.polyline(route.safePoints, {
          color: '#10b981',
          weight: 6,
          opacity: 0.95,
          lineJoin: 'round'
        }).addTo(routeGroup);

        safePolyline.bindPopup(`
          <div class="p-3 text-xs">
            <strong class="text-emerald-700 font-bold block mb-1">✅ Corredor Seguro Activo en Tiempo Real</strong>
            <p class="text-slate-700">Trayecto verificado sin puntos de peligro crítico. Distancia: ${route.distancia} &bull; ${route.tiempoEstimado}.</p>
          </div>
        `);

        // Ajustar zoom para mostrar la ruta completa
        mapInstanceRef.current.fitBounds(safePolyline.getBounds(), { padding: [40, 40] });

        // Si había una simulación activa, reiniciarla
        stopGPSSimulation();
      };

      // Iniciar simulación de desplazamiento GPS en tiempo real
      const startGPSSimulation = () => {
        if (!activeRoute || !mapInstanceRef.current) return;

        setIsSimulatingGPS(true);
        setSimProgress(0);

        const points = activeRoute.safePoints;
        let step = 0;
        const totalSteps = 60; // 60 ticks de animación suave

        // Crear o reutilizar marcador del vehículo
        if (!liveVehicleMarkerRef.current) {
          const vehicleIcon = L.divIcon({
            className: 'live-vehicle-marker-icon',
            html: `
              <div class="live-gps-vehicle">
                🚗
              </div>
            `,
            iconSize: [38, 38],
            iconAnchor: [19, 19]
          });

          liveVehicleMarkerRef.current = L.marker(points[0], { icon: vehicleIcon }).addTo(mapInstanceRef.current);
        }

        if (animationTimerRef.current) clearInterval(animationTimerRef.current);

        animationTimerRef.current = setInterval(() => {
          step++;
          const progress = step / totalSteps;
          setSimProgress(Math.min(100, Math.round(progress * 100)));

          // Interpolar posición entre los puntos
          const totalSegments = points.length - 1;
          const currentSegIndex = Math.min(Math.floor(progress * totalSegments), totalSegments - 1);
          const segProgress = (progress * totalSegments) - currentSegIndex;

          const p1 = points[currentSegIndex];
          const p2 = points[currentSegIndex + 1];

          if (p1 && p2) {
            const currentLat = p1[0] + (p2[0] - p1[0]) * segProgress;
            const currentLng = p1[1] + (p2[1] - p1[1]) * segProgress;

            liveVehicleMarkerRef.current.setLatLng([currentLat, currentLng]);

            // Centrar suavemente en el vehículo cada pocos frames
            if (step % 5 === 0) {
              mapInstanceRef.current.panTo([currentLat, currentLng], { animate: true });
            }
          }

          // Variar velocidad simulada (22 - 30 km/h)
          setCurrentSpeed(Math.round(22 + Math.sin(step) * 6));

          if (step >= totalSteps) {
            clearInterval(animationTimerRef.current);
            setIsSimulatingGPS(false);
          }
        }, 400);
      };

      const stopGPSSimulation = () => {
        if (animationTimerRef.current) clearInterval(animationTimerRef.current);
        setIsSimulatingGPS(false);
        setSimProgress(0);
        if (liveVehicleMarkerRef.current && mapInstanceRef.current) {
          mapInstanceRef.current.removeLayer(liveVehicleMarkerRef.current);
          liveVehicleMarkerRef.current = null;
        }
      };

      // Actualizar marcadores de incidentes
      useEffect(() => {
        if (!mapInstanceRef.current || !markersGroupRef.current) return;

        const markersGroup = markersGroupRef.current;
        markersGroup.clearLayers();

        filteredReports.forEach((rep) => {
          let bgColor = '#10b981';
          let iconHtml = '🛡️';
          let pulseClass = '';

          if (rep.severidad === 'peligro') {
            bgColor = '#ef4444';
            iconHtml = '⚠️';
            pulseClass = 'pulse-danger';
          } else if (rep.severidad === 'precaucion') {
            bgColor = '#f59e0b';
            iconHtml = '⚡';
          }

          const customIcon = L.divIcon({
            className: 'custom-leaflet-div-icon',
            html: `
              <div class="custom-map-marker ${pulseClass}" style="background-color: ${bgColor}; width: 34px; height: 34px; font-size: 15px;">
                ${iconHtml}
              </div>
            `,
            iconSize: [34, 34],
            iconAnchor: [17, 17],
            popupAnchor: [0, -18]
          });

          const marker = L.marker([rep.lat, rep.lng], { icon: customIcon });

          const popupContent = `
            <div class="text-slate-800 text-xs w-64 overflow-hidden rounded-xl font-sans">
              ${rep.foto ? `
                <div class="w-full h-28 overflow-hidden bg-slate-200 relative">
                  <img src="${rep.foto}" alt="${rep.barrio}" class="w-full h-full object-cover"/>
                  <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold text-white shadow" style="background-color: ${bgColor}">
                    ${rep.severidad === 'peligro' ? 'PELIGRO' : rep.severidad === 'precaucion' ? 'PRECAUCIÓN' : 'TRANSITABLE'}
                  </span>
                </div>
              ` : ''}
              <div class="p-3.5 space-y-2">
                <div>
                  <h4 class="font-bold text-sm text-slate-900 leading-snug">${rep.barrio}</h4>
                  <p class="text-slate-500 text-[11px] font-medium">${rep.direccion}</p>
                </div>
                
                <div class="bg-slate-50 p-2 rounded-lg border border-slate-100 space-y-1 text-[11px]">
                  <div class="flex justify-between">
                    <span class="text-slate-400">Nivel de Agua:</span>
                    <strong class="text-slate-800">${rep.nivelAgua || 'No especificado'}</strong>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-slate-400">Tipo:</span>
                    <span class="font-semibold capitalize text-slate-700">${rep.tipo}</span>
                  </div>
                </div>

                <p class="text-slate-600 text-xs leading-relaxed">
                  ${rep.descripcion}
                </p>

                <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
                  <span>${rep.fecha}</span>
                  <span class="font-semibold text-slate-500">${rep.autor}</span>
                </div>
              </div>
            </div>
          `;

          marker.bindPopup(popupContent);
          marker.addTo(markersGroup);

          if (selectedReportOnMap && selectedReportOnMap.id === rep.id) {
            mapInstanceRef.current.setView([rep.lat, rep.lng], 16, { animate: true });
            marker.openPopup();
          }
        });
      }, [filteredReports, selectedReportOnMap]);

      // Reajustar tamaño de mapa
      useEffect(() => {
        const timer = setTimeout(() => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.invalidateSize();
          }
        }, 150);
        return () => clearTimeout(timer);
      }, []);

      const resetView = () => {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.setView(CIENAGA_CENTER, 14, { animate: true });
          setSelectedReportOnMap(null);
        }
      };

      return (
        <div className="flex flex-col h-[calc(100vh-120px)] space-y-3">
          
          {/* PANEL DE CONTROL DE RUTAS EN TIEMPO REAL */}
          <div className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-md">
            <div className="flex flex-wrap items-center justify-between gap-3">
              
              {/* Selector de Origen y Destino */}
              <div className="flex flex-wrap items-center gap-2 text-xs">
                <span className="font-bold text-slate-700 dark:text-slate-200 flex items-center">
                  <i data-lucide="navigation-2" className="w-4 h-4 mr-1 text-emerald-500"></i>
                  Ruta en Vivo:
                </span>

                <div className="flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 rounded-xl">
                  <span className="text-slate-400 text-[11px]">Desde:</span>
                  <select
                    value={origen}
                    onChange={(e) => {
                      setOrigen(e.target.value);
                      calculateAndDrawRoute(e.target.value, destino);
                    }}
                    className="bg-transparent font-bold text-slate-800 dark:text-slate-100 outline-none"
                  >
                    {BARRIOS_CIENAGA.map(b => (
                      <option key={b} value={b} className="bg-slate-900 text-white">{b}</option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-800 px-2.5 py-1.5 rounded-xl">
                  <span className="text-slate-400 text-[11px]">Hasta:</span>
                  <select
                    value={destino}
                    onChange={(e) => {
                      setDestino(e.target.value);
                      calculateAndDrawRoute(origen, e.target.value);
                    }}
                    className="bg-transparent font-bold text-slate-800 dark:text-slate-100 outline-none"
                  >
                    {BARRIOS_CIENAGA.map(b => (
                      <option key={b} value={b} className="bg-slate-900 text-white">{b}</option>
                    ))}
                  </select>
                </div>

                <button
                  onClick={() => calculateAndDrawRoute(origen, destino)}
                  className="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-xl font-bold transition-all shadow-xs flex items-center space-x-1"
                >
                  <i data-lucide="refresh-cw" className="w-3.5 h-3.5"></i>
                  <span>Recalcular</span>
                </button>
              </div>

              {/* Botón de Simulación de GPS en Tiempo Real */}
              <div className="flex items-center space-x-2">
                {!isSimulatingGPS ? (
                  <button
                    onClick={startGPSSimulation}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-md shadow-emerald-600/30 transition-transform active:scale-95 animate-pulse"
                  >
                    <i data-lucide="play" className="w-4 h-4"></i>
                    <span>Simular Recorrido GPS</span>
                  </button>
                ) : (
                  <button
                    onClick={stopGPSSimulation}
                    className="bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-md shadow-red-600/30 transition-transform active:scale-95"
                  >
                    <i data-lucide="square" className="w-4 h-4"></i>
                    <span>Detener GPS ({simProgress}%)</span>
                  </button>
                )}

                <button
                  onClick={resetView}
                  title="Centrar en Ciénaga"
                  className="p-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
                >
                  <i data-lucide="compass" className="w-4 h-4"></i>
                </button>
              </div>

            </div>

            {/* Barra de Telemetría HUD de la Ruta Activa */}
            {activeRoute && (
              <div className="mt-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between text-xs gap-3">
                <div className="flex items-center space-x-4">
                  <span className="text-emerald-600 dark:text-emerald-400 font-bold flex items-center">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1.5 animate-ping"></span>
                    Corredor Seguro: {activeRoute.distancia} ({activeRoute.tiempoEstimado})
                  </span>

    function AiAssistantView({ reports, onNavigateToMap }) {
      const [messages, setMessages] = useState([
        {
          id: "m-1",
          sender: "ia",
          text: "¡Hola! Soy **Rutas Seguras IA**, tu asistente inteligente con navegación en tiempo real para Ciénaga, Magdalena.\n\nPuedes consultarme cómo desplazarte de forma segura entre barrios, qué calles están anegadas o qué ruta alternativa evita las alcantarillas abiertas.",
          timestamp: "Ahora mismo"
        }
      ]);
      const [inputQuery, setInputQuery] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping]);

      const QUICK_PROMPTS = [
        "¿Qué ruta en tiempo real puedo tomar de Kennedy al Centro?",
        "¿Por qué debo evitar la Calle 13 en Barrio Abajo?",
        "¿Dónde hay alcantarillas destapadas en Ciénaga?",
        "¿Cómo está la Carrera 21 en La Floresta para transitar?"
      ];

      const processAIQuery = (queryText) => {
        const query = queryText.toLowerCase().trim();
        const peligros = reports.filter(r => r.severidad === 'peligro');
        const transitables = reports.filter(r => r.severidad === 'transitable');
        const alcantarillas = reports.filter(r => r.tipo === 'alcantarilla' || r.descripcion.toLowerCase().includes('alcantarilla'));

        let reply = "";
        let matchedBarrio = null;

        if (query.includes('kennedy') && query.includes('centro')) {
          reply = `📍 **Ruta Segura en Tiempo Real: Kennedy ➡️ Centro Histórico**\n\n` +
                  `⚠️ **Puntos Críticos Bloqueados en el Radar:**\n` +
                  `- **Calle 28 cerca de la Troncal:** Socavón de 1 metro oculto bajo 35 cm de agua.\n` +
                  `- **Calle 13 en Barrio Abajo:** Inundación crítica de 45 cm (corte total para motos).\n\n` +
                  `✅ **Trazado Dinámico Calculado:**\n` +
                  `1. Desplázate por la Troncal del Caribe hacia el oriente.\n` +
                  `2. Toma la **Carrera 21 hacia La Floresta**, donde el canal pluvial está drenando eficazmente.\n` +
                  `3. Sube por Calle 16 y accede al Centro Histórico por la **Calle 7**, la cual tiene cota elevada y está 100% transitable.\n\n` +
                  `🛰️ *Puedes ver este trazado con GPS en vivo en la pestaña 'Mapa & Rutas en Vivo'.*`;
          matchedBarrio = "Kennedy";
        } else if (query.includes('abajo') || query.includes('calle 13')) {
          reply = `🚨 **Alerta en Barrio Abajo (Calle 13 con Cra 9):**\n\n` +
                  `Nivel de agua en **45 cm**. Se registran corrientes hacia la Ciénaga que arrastran tapas de registro.\n` +
                  `💡 **Desvío obligatorio en radar:** Rodear por Calle 16 hacia Carrera 21.`;
          matchedBarrio = "Barrio Abajo";
        } else if (query.includes('alcantarilla') || query.includes('tapa')) {
          reply = `⚠️ **Alcantarillas Peligrosas Detectadas:**\n\n` +
                  `• **Centro Histórico:** Calle 9 con Cra 12 (Templete) - Tapa abierta invisible bajo 30cm.\n` +
                  `• **Barrio Abajo:** Calle 13 con Cra 9 - Corriente levantó rejillas.\n\n` +
                  `🚨 *Regla de oro:* No cruces agua que supere los 15 cm; las trampas quedan totalmente ocultas.`;
          matchedBarrio = "Centro Histórico";
        } else {
          reply = `He procesado tu consulta con la red en tiempo real de Ciénaga.\n\n` +
                  `Tenemos **${reports.length} reportes activos** en el radar. Si te desplazas hacia el Centro, te sugiero activar la **Skin Radar Vivo** para seguir la telemetría en tiempo real paso a paso.\n\n` +
                  `⚠️ *Nota preventiva:* Conduce a menos de 25 km/h durante lluvia.`;
        }

        return { reply, matchedBarrio };
      };

      const handleSendMessage = (e) => {
        e?.preventDefault();
        if (!inputQuery.trim()) return;

        const userText = inputQuery.trim();
        setMessages(prev => [...prev, {
          id: `usr-${Date.now()}`,
          sender: "user",
          text: userText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
        setInputQuery("");
        setIsTyping(true);

        setTimeout(() => {
          const { reply, matchedBarrio } = processAIQuery(userText);
          setMessages(prev => [...prev, {
            id: `ia-${Date.now()}`,
            sender: "ia",
            text: reply,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            matchedBarrio
          }]);
          setIsTyping(false);
        }, 550);
      };

      return (
        <div className="max-w-4xl mx-auto flex flex-col h-[calc(100vh-120px)] bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden">
          <div className="p-4 bg-gradient-to-r from-[#030712] via-[#091f3a] to-emerald-900 text-white flex items-center justify-between">

                <i data-lucide="bot" className="w-6 h-6"></i>
              </div>
              <div>
                <h3 className="font-extrabold text-base flex items-center">
                  Rutas Seguras IA
                  <span className="ml-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/30 text-emerald-300 border border-emerald-400/30 uppercase">
                    Tiempo Real
                  </span>
                </h3>
                <p className="text-xs text-emerald-200/80">
                  Asistente de movilidad con cruce dinámico de incidentes
                </p>
              </div>
            </div>
          </div>

          <div className="flex-1 p-4 md:p-6 overflow-y-auto space-y-4 bg-slate-50/50 dark:bg-slate-950/40">
            {messages.map((msg) => (
              <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                <div className="flex items-start space-x-2.5 max-w-[85%]">
                  {msg.sender === 'ia' && (
                    <div className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0 mt-1 shadow-sm">
                      <i data-lucide="sparkles" className="w-4 h-4"></i>
                    </div>
                  )}
                  <div className={`p-4 rounded-2xl text-xs md:text-sm leading-relaxed ${
                    msg.sender === 'user' 
                      ? 'bg-emerald-600 text-white rounded-tr-none' 
                      : 'bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 rounded-tl-none border border-slate-200 dark:border-slate-800 shadow-sm'
                  }`}>
                    <div className="whitespace-pre-line space-y-2">
                      {msg.text.split('\n').map((paragraph, idx) => {
                        if (!paragraph) return <div key={idx} className="h-1"></div>;
                        const parts = paragraph.split(/(\*\*.*?\*\*)/g);
                        return (
                          <p key={idx}>
                            {parts.map((part, pIdx) => {
                              if (part.startsWith('**') && part.endsWith('**')) {
                                return <strong key={pIdx} className="font-bold">{part.slice(2, -2)}</strong>;
                              }
                              return part;
                            })}
                          </p>
                        );
                      })}
                    </div>

                    {msg.matchedBarrio && (
                      <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                        <button
                          onClick={() => onNavigateToMap(msg.matchedBarrio)}
                          className="bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center transition-colors"
                        >
                          <i data-lucide="compass" className="w-3.5 h-3.5 mr-1.5"></i>
                          Ver trazado dinámico hacia {msg.matchedBarrio}
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="text-xs text-slate-400 flex items-center space-x-2">
                <i data-lucide="refresh-cw" className="w-4 h-4 animate-spin text-emerald-500"></i>
                <span>Calculando ruta segura en tiempo real...</span>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>

          <div className="px-4 py-2 bg-slate-100/70 dark:bg-slate-900/60 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2 overflow-x-auto text-xs whitespace-nowrap">
            {QUICK_PROMPTS.map((prompt, i) => (
              <button
                key={i}
                onClick={() => setInputQuery(prompt)}
                className="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-3 py-1 rounded-full text-xs"
              >
                {prompt}
              </button>
            ))}
          </div>

          <form onSubmit={handleSendMessage} className="p-3.5 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2">
            <input
              type="text"
              value={inputQuery}
              onChange={(e) => setInputQuery(e.target.value)}
              placeholder="Pregunta sobre rutas seguras o vías de Ciénaga..."
              className="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 px-4 py-3 rounded-2xl text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
            />
            <button
              type="submit"
              disabled={!inputQuery.trim() || isTyping}
              className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white p-3 rounded-2xl shadow-md transition-all active:scale-95"
            >
              <i data-lucide="send" className="w-5 h-5"></i>
            </button>
          </form>
        </div>
      );
    }

    // ==========================================
    // VISTA REPORTAR INCIDENTE
    // ==========================================
    function ReportIncidentView({ onAddReport, onCancel }) {
      const [barrio, setBarrio] = useState(BARRIOS_CIENAGA[0]);
      const [otroBarrio, setOtroBarrio] = useState("");
      const [direccion, setDireccion] = useState("");
      const [tipo, setTipo] = useState("inundacion");
      const [severidad, setSeveridad] = useState("peligro");
      const [nivelAgua, setNivelAgua] = useState("30 cm (Moderado)");
      const [descripcion, setDescripcion] = useState("");
      const [fotoPreview, setFotoPreview] = useState(null);
      const [lat, setLat] = useState(CIENAGA_CENTER[0]);
      const [lng, setLng] = useState(CIENAGA_CENTER[1]);
      const [autor, setAutor] = useState("");
      const [gpsStatus, setGpsStatus] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setFotoPreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleGetLocation = () => {
        if (!navigator.geolocation) {
          setGpsStatus("Geolocalización no soportada por el navegador");
          return;
        }
        setGpsStatus("Detectando coordenadas GPS...");
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setLat(Number(pos.coords.latitude.toFixed(5)));
            setLng(Number(pos.coords.longitude.toFixed(5)));
            setGpsStatus("Coordenadas obtenidas con éxito");
          },
          (err) => {
            setGpsStatus("No se pudo obtener GPS. Usando centro de Ciénaga.");
            console.warn(err);
          },
          { timeout: 8000 }
        );
      };

      const handleBarrioChange = (selected) => {
        setBarrio(selected);
        const coords = BARRIOS_DATA[selected];
        if (coords) {
          setLat(coords[0]);
          setLng(coords[1]);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const finalBarrio = barrio === "Otro" ? (otroBarrio || "Sector Ciénaga") : barrio;

        const newReport = {
          id: `rep-${Date.now()}`,
          barrio: finalBarrio,
          direccion: direccion || "Dirección no especificada",
          tipo: tipo,
          severidad: severidad,
          nivelAgua: nivelAgua,
          descripcion: descripcion || "Reporte generado por ciudadano en Ciénaga.",
          lat: lat,
          lng: lng,
          fecha: "Hace instantes",
          autor: autor.trim() || "Ciudadano Vigilante",
          foto: fotoPreview || "https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=600&q=80",
          verificado: true
        };

        setTimeout(() => {
          onAddReport(newReport);
          setIsSubmitting(false);
        }, 400);
      };

      return (
        <div className="max-w-3xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-200 dark:border-slate-800 shadow-xl">
          <div className="flex items-center space-x-3 pb-6 border-b border-slate-100 dark:border-slate-800">
            <div className="w-12 h-12 rounded-2xl bg-red-100 dark:bg-red-950/60 text-red-600 flex items-center justify-center shrink-0">
              <i data-lucide="alert-triangle" className="w-6 h-6"></i>
            </div>
            <div>
              <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">
                Reportar Calle Inundada o Peligro
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Se sincroniza en tiempo real con el mapa y actualiza las rutas seguras al instante.
              </p>
            </div>
          </div>

          <form onSubmit={handleSubmit} className="mt-6 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Barrio o Sector de Ciénaga *
                </label>
                <select
                  value={barrio}
                  onChange={(e) => handleBarrioChange(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2.5 text-xs md:text-sm outline-none"
                  required
                >
                  {BARRIOS_CIENAGA.map((b) => (
                    <option key={b} value={b}>{b}</option>
                  ))}
                  <option value="Otro">Otro sector...</option>
                </select>
                {barrio === "Otro" && (
                  <input
                    type="text"
                    value={otroBarrio}
                    onChange={(e) => setOtroBarrio(e.target.value)}
                    placeholder="Escribe el nombre del barrio"
                    className="mt-2 w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 rounded-xl px-4 py-2 text-xs"
                    required
                  />
                )}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Calle / Carrera / Referencia *
                </label>
                <input
                  type="text"
                  value={direccion}
                  onChange={(e) => setDireccion(e.target.value)}
                  placeholder="Ej: Calle 13 entre Carreras 8 y 10"
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2.5 text-xs md:text-sm outline-none"
                  required
                />
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Tipo de Incidente *
                </label>
                <select
                  value={tipo}
                  onChange={(e) => setTipo(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2.5 text-xs md:text-sm outline-none"
                >
                  <option value="inundacion">Calle Inundada / Desbordada</option>
                  <option value="alcantarilla">Alcantarilla Sin Tapa</option>
                  <option value="hueco">Socavón / Hueco Peligroso</option>
                  <option value="transitable">Vía Despejada / Transitable</option>
                  <option value="arbol">Árbol o Poste Caído</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Nivel de Peligro *
                </label>
                <select
                  value={severidad}
                  onChange={(e) => setSeveridad(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2.5 text-xs md:text-sm outline-none font-semibold"
                >
                  <option value="peligro" className="text-red-600">🔴 Peligro Crítico (Rojo)</option>
                  <option value="precaucion" className="text-amber-500">🟡 Precaución (Amarillo)</option>
                  <option value="transitable" className="text-emerald-600">🟢 Transitable (Verde)</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Nivel de Agua
                </label>
                <select
                  value={nivelAgua}
                  onChange={(e) => setNivelAgua(e.target.value)}
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2.5 text-xs md:text-sm outline-none"
                >
                  <option value="Seco / 0 cm">Seco / Desagüe normal</option>
                  <option value="10 - 20 cm (Encharcado)">10 - 20 cm (Encharcado)</option>
                  <option value="30 cm (Moderado)">30 cm (Cubre aceras)</option>
                  <option value="> 45 cm (Crítico)">Mayor a 45 cm (Imposible cruzar)</option>
                </select>
              </div>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                Descripción del Estado *
              </label>
              <textarea
                rows="3"
                value={descripcion}
                onChange={(e) => setDescripcion(e.target.value)}
                placeholder="Detalla si hay corriente fuerte, tapas levantadas, autos atrapados, etc."
                className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl p-3 text-xs md:text-sm outline-none"
                required
              ></textarea>
            </div>

            <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase flex items-center">
                  <i data-lucide="map-pin" className="w-4 h-4 mr-1 text-emerald-500"></i>
                  Geolocalización GPS
                </span>
                <button
                  type="button"
                  onClick={handleGetLocation}
                  className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold flex items-center"
                >
                  <i data-lucide="crosshair" className="w-3.5 h-3.5 mr-1.5"></i>
                  Capturar mi GPS
                </button>
              </div>
              <div className="grid grid-cols-2 gap-3 text-xs font-mono">
                <input
                  type="number"
                  step="0.0001"
                  value={lat}
                  onChange={(e) => setLat(parseFloat(e.target.value))}
                  className="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                />
                <input
                  type="number"
                  step="0.0001"
                  value={lng}
                  onChange={(e) => setLng(parseFloat(e.target.value))}
                  className="p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                />
              </div>
              {gpsStatus && <p className="text-[11px] text-emerald-500">{gpsStatus}</p>}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Evidencia Fotográfica
                </label>
                <div className="flex items-center space-x-3">
                  <label className="cursor-pointer bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 px-4 py-2 rounded-xl text-xs font-medium text-slate-700 dark:text-slate-200 flex items-center border border-dashed border-slate-300">
                    <i data-lucide="camera" className="w-4 h-4 mr-2 text-emerald-500"></i>
                    Subir Foto
                    <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden"/>
                  </label>
                  {fotoPreview && (
                    <img src={fotoPreview} alt="Preview" className="w-10 h-10 rounded-lg object-cover border"/>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1.5">
                  Tu Nombre / Identificador
                </label>
                <input
                  type="text"
                  value={autor}
                  onChange={(e) => setAutor(e.target.value)}
                  placeholder="Ej: Vecino Barrio Abajo"
                  className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-xl px-4 py-2 text-xs md:text-sm"
                />
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end space-x-3">
              <button
                type="button"
                onClick={onCancel}
                className="px-5 py-2.5 rounded-xl text-slate-600 dark:text-slate-400 text-xs md:text-sm font-semibold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                disabled={isSubmitting}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs md:text-sm shadow-lg shadow-emerald-600/30 flex items-center space-x-2"
              >
                <i data-lucide="check" className="w-4 h-4"></i>
                <span>{isSubmitting ? "Publicando..." : "Publicar en Mapa en Tiempo Real"}</span>
              </button>
            </div>
          </form>
        </div>
      );
    }

    // ==========================================
    // VISTA LÍNEAS DE EMERGENCIA
    // ==========================================
    function EmergenciesView() {
      const contactos = [
        {
          entidad: "Cuerpo de Bomberos Voluntarios de Ciénaga",
          linea: "119 / 310 706 9452",
          descripcion: "Atención inmediata de inundaciones graves, rescate de vehículos y personas atrapadas.",
          color: "border-red-500 bg-red-50/40 dark:bg-red-950/20"
        },
        {
          entidad: "Defensa Civil Colombiana - Seccional Ciénaga",
          linea: "144 / 320 237 8190",
          descripcion: "Evacuación preventiva, apoyo comunitario en barrios críticos y albergues.",
          color: "border-orange-500 bg-orange-50/40 dark:bg-orange-950/20"
        },
        {
          entidad: "Cruz Roja Colombiana - Ciénaga",
          linea: "132",
          descripcion: "Primeros auxilios médicos en terreno y atención prehospitalaria.",
          color: "border-rose-500 bg-rose-50/40 dark:bg-rose-950/20"
        },
        {
          entidad: "Policía Nacional - Distrito Ciénaga",
          linea: "123 / (605) 482 1212",
          descripcion: "Control de orden público y desvíos viales intermunicipales.",
          color: "border-blue-500 bg-blue-50/40 dark:bg-blue-950/20"
        }
      ];

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 className="text-xl font-extrabold text-slate-900 dark:text-white mb-2 flex items-center">
              <i data-lucide="phone-forwarded" className="w-6 h-6 mr-2 text-red-600"></i>
              Líneas Directas de Emergencia en Ciénaga, Magdalena
            </h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">
              Comunícate inmediatamente si observas vehículos atrapados o aumento violento del nivel pluvial.
            </p>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {contactos.map((c, i) => (
                <div key={i} className={`p-5 rounded-2xl border-l-4 ${c.color} border border-slate-200/80 dark:border-slate-800 shadow-xs space-y-2`}>
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">{c.entidad}</h3>
                  <div className="text-base font-extrabold text-emerald-600 dark:text-emerald-400 font-mono">
                    📞 {c.linea}
                  </div>
                  <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                    {c.descripcion}
                  </p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Renderizar App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
